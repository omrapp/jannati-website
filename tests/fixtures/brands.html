<!doctype html>
<!--
  Trimmed brands index. Brand cards are anchors carrying `class="vendor-logo"`
  and a `title` holding the English name; each brand appears twice on the real
  page (once under "trending", once in the A-Z list). Plain collection links in
  the navigation are categories and must not be mistaken for brands.
-->
<html lang="ar" dir="rtl">
  <body>
    <nav><a href="/collections/body-lotion">لوشن الجسم</a></nav>
    <div class="brand-card brand-card--badged">
      <span class="brand-badge">رائج</span>
      <a href="/collections/abib" class="vendor-logo" title="Abib">
        <img src="//darbeauty.com/cdn/shop/files/Abib.png?v=1775581696&amp;width=400" alt="Abib" />
      </a>
    </div>
    <div class="brand-card">
      <a href="/collections/abib" class="vendor-logo" title="Abib">
        <img src="//darbeauty.com/cdn/shop/files/Abib.png?v=1775581696&amp;width=400" alt="Abib" />
      </a>
    </div>
    <div class="brand-card">
      <a class="vendor-logo" href="/collections/anua" title="Anua">
        <img src="//darbeauty.com/cdn/shop/files/Anua.png?v=1775581696&amp;width=400" alt="Anua" />
      </a>
    </div>
    <a href="/pages/about">من نحن</a>
  </body>
</html>
